<div class="container">
    <div class="form-box">
      <h2>Plan Application Form</h2>
  
      <p *ngIf="errorMessage" role="alert" class="error">{{errorMessage}}</p>
      <form [formGroup]="planForm" (ngSubmit)="applyForPlan()">
        <div class="form-row">
          <div class="form-group">
            <label for="amount">Applied Amount:</label>
            <input type="text" id="amount" formControlName="appliedAmount" required>
            <div *ngIf="planForm.controls['appliedAmount'].invalid && planForm.controls['appliedAmount'].touched" class="error">
              *Applied Amount is required and must be at least 100.
            </div>
          </div>
        </div>
        <p class="form-note">Application date is recorded by the server. A manager can add a decision note after review.</p>

        <label for="proof">Proof Image (PNG/JPEG, up to 2 MB):</label>
        <input type="file" id="proof" required (change)="onFileSelected($event)" accept="image/png,image/jpeg" />
        <p class="form-note" *ngIf="fileName">Selected File: {{fileName}}</p>
        <div *ngIf="planForm.controls['image'].invalid && planForm.controls['image'].touched" class="error">
          *Proof Document is required.
        </div>
  
        <button type="submit" class="submit-btn">Submit</button>
      </form>
    </div>
  
    <!-- Modal -->
    <div class="modal" tabindex="-1" role="dialog" [ngClass]="{'show': showModal}" style="display: block;" *ngIf="showModal">
      <div class="modal-dialog" role="document">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Success</h5>
          </div>
          <div class="modal-body">
            <p>Successfully applied!</p>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-primary" (click)="showModal = false">OK</button>
          </div>
        </div>
      </div>
    </div>
  </div>
